<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

	<!-- layout width relative to screen and load at 100% zoom -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snake Game</title>

</head>
<body class= "game">
<canvas id="game" width="800" height="800"></canvas>

<script>

	<!-- prepare Canvas -->
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

	<!-- get URL-parameters -->
const params = new URLSearchParams(window.location.search);
const snakeColor = params.get("snakeColor");

	<!-- set size for snake and gamefield -->
const size = 20;
const cols = canvas.width / size;
const rows = canvas.height / size;

	<!-- initiate game-variables-->
let snake;
let direction;
let food;
let score;
let canChangeDirection;
let gameInterval;
let isPaused = false;
let gameStarted = false;

	<!-- function for sending score to iframe -->
function sendScore() {
	window.parent.postMessage({
		type: "scoreUpdate",
		score: score
	}, "*");
}

        <!-- function for sending game over to iframe -->
function sendGameOver() {
	window.parent.postMessage({
		type: "gameOver",
		score: score
	}, "*");
}

        <!-- function for placing food + checking, if block of placement contains a part of the snake -->
function placeFood() {
	let valid = false;

	while (!valid) {
	food = {
		x: Math.floor(Math.random() * cols) * size,
		y: Math.floor(Math.random() * rows) * size
	};

	valid = true;

	for (const s of snake) {
		if (food.x === s.x && food.y === s.y) {
			valid = false;
			break;
		}
	}
	}
}

        <!-- function for starting the game + resetting most variables -->
function initGame() {
	snake = [{ x: 300, y: 300 }];
	direction = "RIGHT";
	score = 0;
	canChangeDirection = true;
	placeFood();
	sendScore();
	draw();
}

        <!-- function for restart the game -->
function restartGame() {
	initGame();
}

        <!-- function for ending the game -->
function gameOver() {
	clearInterval(gameInterval);
	sendGameOver();
}

        <!-- main function for running the game / updating the variables -->
function update() {
	canChangeDirection = true;

	const head = { ...snake[0] };

	if (direction === "UP") head.y -= size;
	if (direction === "DOWN") head.y += size;
	if (direction === "LEFT") head.x -= size;
	if (direction === "RIGHT") head.x += size;

	if (head.x < 0 || head.y < 0 || head.x >= canvas.width || head.y >= canvas.height) {
		gameOver();
		return;
	}

	for (const s of snake) {
		if (head.x === s.x && head.y === s.y) {
			gameOver();
			return;
		}
	}

	snake.unshift(head);

	if (head.x === food.x && head.y === food.y) {
		score++;
		sendScore();
		placeFood();
	}

	else {
		snake.pop();
	}
}

        <!-- function for the colors of the game -->
function draw() {
	ctx.fillStyle = "black";
	ctx.fillRect(0, 0, canvas.width, canvas.height);

	ctx.fillStyle = snakeColor;

	for (const s of snake) {
		ctx.fillRect(s.x, s.y, size, size);
		ctx.strokeStyle = snakeColor;
		ctx.strokeRect(s.x, s.y, size, size);
	}

	ctx.fillStyle = "red";
	ctx.fillRect(food.x, food.y, size, size);
	}

        <!-- function for starting the game + checking, if the game is started or paused -->
function startGame() {

	if (gameStarted && !isPaused) return;

	if (!gameStarted) {
		initGame();
		gameStarted = true;
	}

	isPaused = false;
	clearInterval(gameInterval);
	gameInterval = setInterval(gameLoop, 85);
}

        <!-- function for pausing the game -->
function pauseGame() {

	if (!gameStarted || isPaused) return;

	isPaused = true;
	clearInterval(gameInterval);
}

        <!-- function for stop pausing the game -->
function resumeGame() {

	if (!gameStarted || !isPaused) return;

	isPaused = false;
	clearInterval(gameInterval);
	gameInterval = setInterval(gameLoop, 85);
}

        <!-- main loop of the game (1 Frame per loop) -->
function gameLoop() {
	update();
	draw();
}

        <!-- function for controls + preventing U-turn in 1 frame -->
document.addEventListener("keydown", function(e) {
	if (isPaused) return;
	if (!canChangeDirection) return;

	const key = e.key.toLowerCase();

	if (key === "w" && direction !== "DOWN") {
		direction = "UP";
		canChangeDirection = false;
	}
	
	else if (key === "s" && direction !== "UP") {
		direction = "DOWN";
		canChangeDirection = false;
	}

	else if (key === "a" && direction !== "RIGHT") {
		direction = "LEFT";
		canChangeDirection = false;
	}

	else if (key === "d" && direction !== "LEFT") {
		direction = "RIGHT";
		canChangeDirection = false;
	}
});

        <!-- function for receiving messages from iframe -->
window.addEventListener("message", function(event) {
	if (!event.data || typeof event.data !== "object") return;

	if (event.data.type === "startGame") {
		startGame();
	}

	if (event.data.type === "restartGame") {
		clearInterval(gameInterval);
		gameStarted = false;
		isPaused = false;
		startGame();
	}

	if (event.data.type === "togglePause") {
		if (!gameStarted) return;

		if (isPaused) {
			resumeGame();
		}
		else {
		pauseGame();
		}
		}
});

        <!-- function for setting focus on the frame -->
window.addEventListener("load", function() {
	window.focus();
	document.body.addEventListener("click", function() {
	window.focus();
	});
});

        <!-- start game -->
initGame();
gameStarted=true;

        <!-- set framerate to 1 frame per 85 ms -->
gameInterval = setInterval(gameLoop, 85);
</script>
</body>
</html>
