<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
    body { margin: 10px; background: #170033; }
    canvas { display: block; margin: auto; background: #111; }
</style>
</head>
<body>
<canvas id="game" width="800" height="800" style="display:block; margin:auto; background:#111;">
</canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreDisplay = parent.document.getElementById("scoreDisplay");

let snake = [{x: 300, y: 300 }];
let direction = "RIGHT";
let food = {x: 100, y: 100};
let size = 20;
let score = 0;
let canChangeDirection = true;

document.addEventListener("keydown", e => {
    if (!canChangeDirection) return; 				// Controls + 1 Input per Frame //

    if (e.key === "w" && direction !== "DOWN")
	direction = "UP";
	canChangeDirection = false;
    if (e.key === "s" && direction !== "UP")
	direction = "DOWN";
	canChangeDirection = false;
    if (e.key === "a" && direction !== "RIGHT")
	direction = "LEFT";
	canChangeDirection = false;
    if (e.key === "d" && direction !== "LEFT")
	direction = "RIGHT";
	canChangeDirection = false;
});

function update() {
    canChangeDirection = true;
    let head = { ...snake[0] };

    if (direction === "UP") head.y -= size;
    if (direction === "DOWN") head.y += size;
    if (direction === "LEFT") head.x -= size;
    if (direction === "RIGHT") head.x += size;

    // Wand-Kollision
    if (head.x < 0 || head.y < 0 || head.x >= canvas.width || head.y >= canvas.height) {
        reset();
        return;
    }

    // Selbst-Kollision
    for (let s of snake) {
        if (head.x === s.x && head.y === s.y) {
            reset();
            return;
        }
    }

    snake.unshift(head);

    // Essen
    if (head.x === food.x && head.y === food.y) {
        let valid = false;					// check if place to spawn is already taken by snake //
	
        const cols = canvas.width / size;
        const rows = canvas.height / size;
    while (!valid) {
    	    food.x = Math.floor(Math.random() * cols) * size;
            food.y = Math.floor(Math.random() * rows) * size;
        valid = true;
        for (let s of snake) {
            if (food.x === s.x && food.y === s.y) {
                valid = false;
                break;
            }
const scoreDisplay = document.getElementById("scoreDisplay");        }
    }

        score++;
        const scoreDisplay = parent.document.getElementById("scoreDisplay");
        scoreDisplay.textContent = score;
    }
     else {
        snake.pop();
    }
}

function draw() {
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Snake
    ctx.fillStyle = "lime";
    for (let s of snake) {
        ctx.fillRect(s.x, s.y, size, size);
    }

    // Food
    ctx.fillStyle = "red";
    ctx.fillRect(food.x, food.y, size, size);
}

function reset() {
    snake = [{x: 300, y: 300}];
    direction = "RIGHT";
    score = 0;
    scoreDisplay.textContent = score;
}

function gameLoop() {
    update();
    draw();
}

setInterval(gameLoop, 85);
</script>

</body>
</html>
