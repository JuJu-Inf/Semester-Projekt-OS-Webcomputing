<!DOCTYPE html>

<html lang="de">

<head>

	<meta charset="UTF-8">

<!-- layout width relative to screen and load at 100% zoom -->

	<meta name="viewport" content="width=device-width, initial-scale= 1.0">

<!-- website title -->

	<title>Homepage Semesterproject</title>

<!-- referencing the css -->

	<link rel="stylesheet" href="css/style.css" type="text/css">

</head>

<!-- adding Logo and Header and putting them in the header-row class for later formatting -->

<body class="homepage">

	<div class="header-row">
		<h1>Snake Arcade</h1>
	</div>

<main>

<!-- Information Input box and submit button -->

	<div class="wrapper">

<!-- sends form to CGI Python script and method = "post" sends the values via HTTP Post-->

	<form action="cgi-bin/game.cgi" method="post">

		<label for="vorname">first name:</label>
		<input type="text" id="vorname" name="vorname" autocomplete="off">

		<label for="nachname">last name:</label>
		<input type="text" id="nachname" name="nachname" autocomplete="off">

		<label for="email">Email:</label>
		<input type="email" id="email" name="email"  autocomplete="off">

		<button type="submit">submit</button>
	</form>
	</div>
</main>

<footer>

<!-- Footer for THB-Logo,Github-repository & about-us page-->
	<div class= "footer-logos">

		<a href="https://github.com/JuJu-Inf/Semester-Projekt-OS-Webcomputing" target="_blank" rel="noopener noreferrer" class="logo-link">
		<img src="images/GitHub_Logo.png" alt="GitHub Logo" class="Git-logo">
		</a>

		<a href="https://www.th-brandenburg.de/" target="_blank" rel="noopener noreferrer" class="logo-link">
		<img src="images/THB_logo.png" alt="TH Brandenburg Logo" class="THB-logo">
		</a>

		<a href="cgi-bin/about-us.cgi" class="logo-link">
		<img src="images/AboutUs_Logo.png" alt="about us logo" class="About-logo">
		</a>
	
<!-- '_blank' opens window in new tab --> 
<!-- 'rel="noopener noreferre"' prevents browser and page from sending handle back and referrer information to destination -->
	</div>

</footer>
</body>
</html>
