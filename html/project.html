<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage for Semesterproject</title>

    <link rel="stylesheet" href="css/style.css" type="text/css">
</head>
<body>
   <div class="header-row">
    <a href="https://www.th-brandenburg.de/" target="_blank" rel="noopener noreferrer" class="logo-link">
        <img src="images/THB_logo.png" alt="TH Brandenburg logo" class="logo">
    </a>

    <h1>Webcomputing and OS Project Dynamic Website</h1>
</div>

    <div class="wrapper">
        <div id="formBox">
            <form id="userForm">
                <label for="vorname">Vorname</label>
                <input type="text" id="vorname" placeholder="Vorname" autocomplete="off">

                <label for="nachname">Nachname</label>
                <input type="text" id="nachname" placeholder="Nachname" autocomplete="off">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Email" autocomplete="off">

                <button type="submit">Absenden</button>
            </form>
        </div>

        <div id="outputBox">
            <h2>Eingegebene Daten</h2>
            <p><strong>Vorname:</strong> <span id="showVorname"></span></p>
            <p><strong>Nachname:</strong> <span id="showNachname"></span></p>
            <p><strong>Email:</strong> <span id="showEmail"></span></p>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
